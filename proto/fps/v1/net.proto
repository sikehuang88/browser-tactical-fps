syntax = "proto3";

package fps.v1;

option go_package = "github.com/fpsweb/game/gen/fps/v1;fpsv1";

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// C→S 握手：客户端连接后首包必须为 Hello。
message Hello {
  Version client_version = 1;
  string display_name = 2;
  string session_token = 3; // 业务后端签发的短期访问令牌
}

// S→C 握手成功。
message Welcome {
  uint32 player_id = 1;
  uint32 tick_rate = 2;
  uint32 server_rtt_ms = 3; // 0 = 未知
  MatchConfig match_config = 4;
}

message InputButtons {
  bool forward = 1;
  bool back = 2;
  bool left = 3;
  bool right = 4;
  bool jump = 5;
  bool crouch = 6;
  bool sprint = 7;
  bool attack = 8;
  bool use = 9;         // 安装/拆除/拾取
  bool reload = 10;
  bool equip_firearm = 11;
  bool equip_knife = 12;
  bool equip_secondary = 13;
}

// C→S 输入帧（高频不可靠通道）。
message InputFrame {
  uint32 seq = 1;
  InputButtons buttons = 2;
  int32 yaw_delta = 3;   // 厘度相对增量
  int32 pitch_delta = 4; // 厘度相对增量
  sint32 forward_axis = 5; // -127..127
  sint32 strafe_axis = 6;  // -127..127
  uint32 client_sent_at_ms = 7;
}

// S→C 世界快照（20~32Hz，实体兴趣管理 + 增量压缩）。
message Snapshot {
  uint32 tick = 1;
  repeated EntitySnapshot entities = 2;
}

message EntitySnapshot {
  EntityId id = 1;
  Vec3 position = 2;      // 厘米
  int32 yaw = 3;          // 厘度
  int32 pitch = 4;        // 厘度
  bool moving = 5;
  bool crouching = 6;
  int32 health = 7;
  int32 weapon_id = 8;    // 0 = 无
  uint32 ammo = 9;
  bool reloading = 10;
  bool sprinting = 11;
}

// C→S / S→C RTT 探针。
message Ping {
  uint32 client_sent_at_ms = 1;
  uint32 measured_rtt_ms = 2; // 上一次 Ping/Pong 往返的客户端实测值
}

message Pong {
  uint32 client_sent_at_ms = 1;
  uint32 server_recv_at_ms = 2;
}

enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  KICK_REASON_VERSION_MISMATCH = 1;
  KICK_REASON_SERVER_FULL = 2;
  KICK_REASON_PROTOCOL_ERROR = 3;
  KICK_REASON_BANNED = 4;
}

// S→C 断开原因。
message Kick {
  KickReason reason = 1;
  string detail = 2;
}

// S→C 回合/炸弹/计分状态（阶段切换与事件时广播）。
message RoundState {
  enum Phase {
    PHASE_IDLE = 0;
    PHASE_FREEZE = 1;
    PHASE_ACTIVE = 2;
    PHASE_ROUND_END = 3;
    PHASE_MATCH_END = 4;
  }
  enum BombPhase {
    BOMB_NONE = 0;
    BOMB_PLANTING = 1;
    BOMB_PLANTED = 2;
    BOMB_DEFUSING = 3;
    BOMB_EXPLODED = 4;
    BOMB_DEFUSED = 5;
  }
  Phase phase = 1;
  uint32 round = 2;
  uint32 time_ms = 3;
  uint32 attack_score = 4;
  uint32 defend_score = 5;
  BombPhase bomb = 6;
  uint32 bomb_site = 7;
  Team winner = 8;
}

// S→C 击杀播报。
message KillFeed {
  uint32 attacker_id = 1; // 0 = 世界/坠落
  uint32 victim_id = 2;
  uint32 weapon_id = 3;
  bool headshot = 4;
  bool wallbang = 5;
  uint32 distance_cm = 6;
}

// S→C 对局结束。
message MatchEnd {
  Team winner = 1;
  uint32 attack_score = 2;
  uint32 defend_score = 3;
  uint32 reason = 4;
}

// S→C 伤害摘要（仅发给攻击方，UI-003 伤害反馈）。
message Damage {
  uint32 victim_id = 1;
  uint32 damage = 2;
  uint32 victim_health = 3;
}

// C→S 购买/退款请求（GAME-003）。
message Buy {
  uint32 item_id = 1; // 1护甲 2步枪 3冲锋枪 4狙击枪 5烟雾 6闪光 7高爆
}

// S→C 按玩家下发的资金/装备/投掷物状态。
message Economy {
  uint32 player_id = 1;
  uint32 money = 2;
  uint32 weapon_id = 3;
  bool armor = 4;
  uint32 n_smoke = 5;
  uint32 n_flash = 6;
  uint32 n_he = 7;
}

enum GrenadeType {
  GRENADE_SMOKE = 1;
  GRENADE_FLASH = 2;
  GRENADE_HE = 3;
}

// S→C 投掷物生成（客户端据此渲染飞行轨迹，WEAPON-005）。
message GrenadeSpawn {
  uint32 grenade_id = 1;
  GrenadeType type = 2;
  uint32 owner_id = 3;
  Vec3 position = 4;
  Vec3 velocity = 5; // 厘米/秒
}

// S→C 爆炸/生效。
message GrenadeExplode {
  uint32 grenade_id = 1;
  GrenadeType type = 2;
  Vec3 position = 3;
}

// S→C 致盲（仅发给被闪玩家）。
message Flash {
  uint32 strength = 1; // 0..100
}
