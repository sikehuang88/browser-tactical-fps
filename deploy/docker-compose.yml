# 参考部署编排（本机无 Docker 亦可按 README 直接本地运行各组件）。
# 用途：一键拉起业务后端（SQLite 持久化）+ 实时游戏服务器。
# PostgreSQL/Redis 在对应 store/匹配服务落地后接入。
version: "3.9"

services:
  backend:
    build:
      context: ../backend
    command: ["api", "--addr", ":18080", "--db", "/data/fpsweb.db"]
    ports:
      - "18080:18080"
    volumes:
      - backend-data:/data

  gameserver:
    build:
      context: ../server
    command: ["fpsweb-server", "--port", "9000", "--tick-rate", "64", "--max-connections", "128"]
    ports:
      - "9000:9000"
    # 对局实例按队列扩缩容时为有状态独立容器，这里单实例示意

volumes:
  backend-data:
