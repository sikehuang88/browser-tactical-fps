[package]
name = "fpsweb-server"
version = "0.1.0"
edition = "2021"
description = "Web版战术竞技FPS - 实时游戏服务器（64 tick 服务器权威模拟）"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
opt-level = 3
