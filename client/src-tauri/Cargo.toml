[package]
name = "fpsweb-tauri"
version = "0.1.0"
description = "战术竞技 FPS 桌面客户端壳"
authors = ["FPSWeb Team"]
edition = "2021"

[lib]
name = "fpsweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
